name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages is not enabled yet; enabling it now (build_type=workflow)."
            gh api --method POST "repos/${{ github.repository }}/pages" -f "build_type=workflow" || true
          else
            # Pages могли включить в режиме legacy (сырой исходник из корня ветки main).
            # deploy-pages работает только в режиме workflow, поэтому переключаем.
            BUILD_TYPE=$(gh api "repos/${{ github.repository }}/pages" -q .build_type)
            if [ "$BUILD_TYPE" != "workflow" ]; then
              echo "GitHub Pages in build_type=$BUILD_TYPE; switching to workflow."
              gh api --method PUT "repos/${{ github.repository }}/pages" -f "build_type=workflow" \
                || echo "::warning::Не удалось переключить Pages автоматически. Переключите вручную: Settings → Pages → Source → GitHub Actions."
            else
              echo "GitHub Pages is already enabled (workflow)."
            fi
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 нужен смоук-тесту: jsdom 30 требует Node ^22.22.2 (см. engines в package.json)
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audio:check
      - run: npm run content:check
      - run: npm run test:smoke
      - run: npm run build
        env:
          # Путь репозитория на GitHub Pages: https://<owner>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
